name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ambiente
        run: |
          sw_vers
          swift --version

      - name: Build
        run: scripts/build.sh --dist

      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
