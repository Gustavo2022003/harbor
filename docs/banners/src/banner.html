<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harbor banner</title>
<!--
  Banners do README. Gere com:  make docs   (scripts/make-docs.sh)
  ?kind=hero                                   → banner principal (1280×400)
  ?kind=section&title=…&sub=…&icon=…&n=…       → banner de seção (1280×132)
-->
<style>
:root{ --n1:#183A66; --n2:#0B1D3A; --n3:#040A16; --amber:#FF9F0A; --gold:#FFD27A; --flame:#FF6A00; --cyan:#64D2FF; --pink:#FF375F; --ink:#EEF4FF; --mute:#A3B4CF }
*{ box-sizing:border-box }
html,body{ margin:0; background:transparent; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif; color:var(--ink) }
.b{ position:relative; overflow:hidden; border-radius:22px; border:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(70% 120% at 88% -20%, rgba(255,159,10,.22), transparent 60%),
    radial-gradient(60% 120% at 0% 120%, rgba(100,210,255,.14), transparent 60%),
    linear-gradient(160deg, var(--n1) 0%, var(--n2) 45%, var(--n3) 100%) }
.waves{ position:absolute; left:0; right:0; bottom:0; width:100%; pointer-events:none }

/* Hero */
.hero{ width:1280px; height:400px; display:flex; align-items:center; padding:0 64px }
.hero .logo{ width:150px; height:150px; filter:drop-shadow(0 20px 40px rgba(0,0,0,.55)) }
.hero .txt{ margin-left:36px; z-index:2 }
.hero h1{ margin:0; font-size:88px; font-weight:800; letter-spacing:-.03em; line-height:1 }
.hero h1 span{ color:var(--amber) }
.hero p{ margin:12px 0 22px; font-size:23px; color:var(--mute); max-width:450px; line-height:1.35 }
.pills{ display:flex; gap:9px }
.pill{ padding:6px 14px; border-radius:99px; font-size:15px; font-weight:650; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12) }
.pill.a{ background:rgba(255,159,10,.17); border-color:rgba(255,159,10,.4); color:var(--gold) }
.stage{ position:absolute; right:56px; top:0; width:470px; height:100% }
.mb{ position:absolute; top:0; left:0; right:0; height:30px; background:rgba(255,255,255,.07); border-radius:0 0 0 0 }
.isl{ position:absolute; left:50%; transform:translateX(-50%); top:0; width:400px; height:168px; background:#000; border-radius:0 0 34px 34px;
  box-shadow:0 26px 60px rgba(0,0,0,.6), 0 0 80px rgba(255,159,10,.20); padding:30px 24px 0; display:grid; grid-template-columns:84px 1fr; gap:16px }
.art{ width:84px; height:84px; border-radius:18px; background:linear-gradient(135deg,var(--gold),var(--flame) 55%,var(--pink)); box-shadow:0 8px 30px rgba(255,159,10,.45) }
.isl .t1{ font-weight:700; font-size:18px; margin-top:6px }
.isl .t2{ color:#9aa3b2; font-size:14px; margin-top:3px }
.prog{ margin-top:14px; height:5px; border-radius:3px; background:#2b2b2b; overflow:hidden } .prog i{ display:block; width:42%; height:100%; background:var(--amber) }
.ctl{ grid-column:1/3; display:flex; justify-content:center; gap:34px; margin-top:-2px; font-size:19px; color:#fff }
.bars{ position:absolute; right:24px; top:34px; display:flex; gap:3px; align-items:center }
.bars i{ width:4px; border-radius:2px; background:var(--amber) }
.bub{ position:absolute; top:8px; width:46px; height:46px; border-radius:50%; background:#000; display:flex; align-items:center; justify-content:center; font-size:21px;
  box-shadow:0 10px 24px rgba(0,0,0,.5) }
.badge{ position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--pink); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center }
.tabs{ position:absolute; left:50%; transform:translateX(-50%); top:182px; height:40px; border-radius:20px; background:#000; display:flex; align-items:center; gap:16px; padding:0 18px; font-size:15px; color:#cfd3da;
  box-shadow:0 12px 30px rgba(0,0,0,.5) }
.tabs b{ white-space:nowrap; background:#26262a; color:#fff; padding:5px 12px; border-radius:14px }

/* Section */
.sec{ width:1280px; height:132px; display:flex; align-items:center; padding:0 40px 8px; gap:26px }
.sec .logo{ width:64px; height:64px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5)) }
.sec .div{ width:1px; height:58px; background:linear-gradient(transparent,rgba(255,255,255,.25),transparent) }
.sec .tile{ width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:32px;
  background:linear-gradient(145deg,rgba(255,159,10,.25),rgba(255,106,0,.08)); border:1px solid rgba(255,159,10,.35); box-shadow:0 0 40px rgba(255,159,10,.18) }
.sec > div{ position:relative; z-index:2 }
.sec h2{ margin:0; font-size:40px; font-weight:800; letter-spacing:-.02em; line-height:1.05 }
.sec p{ margin:6px 0 0; font-size:18px; color:var(--mute) }
.sec .num{ margin-left:auto; font-size:92px; font-weight:800; letter-spacing:-.05em; color:transparent; -webkit-text-stroke:2px rgba(255,159,10,.75); line-height:1; z-index:1 }
.sec .brand{ position:absolute; right:40px; bottom:12px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.28) }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'hero';
const waves = (h, n=3, op=.35) => `<svg class="waves" style="height:${h}px" viewBox="0 0 1280 ${h}" preserveAspectRatio="none">${
  Array.from({length:n},(_,i)=>{ const y=h*.35+i*(h*.2); let d=`M0 ${y}`; for(let x=0;x<=1280;x+=80) d+=` Q ${x+40} ${y-10} ${x+80} ${y}`;
    return `<path d="${d}" fill="none" stroke="#64D2FF" stroke-opacity="${op-i*.09}" stroke-width="2.4"/>`; }).join('')}</svg>`;
const bars = (n,hs) => `<span class="bars">${Array.from({length:n},(_,i)=>`<i style="height:${hs[i%hs.length]}px"></i>`).join('')}</span>`;
const root = document.getElementById('root');

if (kind === 'hero') {
  root.innerHTML = `<div class="b hero">
    <img class="logo" src="../../manual/src/img/icon.png">
    <div class="txt"><h1>Harbor<span>.</span></h1>
      <p>A Dynamic Island do seu Mac. Nativa, feita em SwiftUI, a um hover do topo da tela.</p>
      <div class="pills"><span class="pill a">macOS 14+</span><span class="pill">SwiftUI + AppKit</span><span class="pill">Liquid Glass</span></div></div>
    <div class="stage">
      <div class="isl"><div class="art"></div><div><div class="t1">Harbor Radio</div><div class="t2">Lo-fi para programar</div><div class="prog"><i></i></div></div>
        <div class="ctl">⏮ &nbsp; ⏸ &nbsp; ⏭</div>${bars(6,[12,22,16,26,10,18])}</div>
      <div class="bub" style="left:calc(50% + 212px);box-shadow:0 0 0 2px #FF9F0A,0 10px 24px rgba(0,0,0,.5)">🎙️</div>
      <div class="bub" style="left:calc(50% + 212px);top:62px">💬<span class="badge">3</span></div>
      <div class="tabs"><b>▶ Mídia</b><span>⧉</span><span>⑂</span><span>▦</span><span>⬚</span><span>✦</span></div>
    </div>
    ${waves(90,3,.4)}
  </div>`;
} else {
  const n = q.get('n') || '';
  root.innerHTML = `<div class="b sec">
    <img class="logo" src="../../manual/src/img/icon.png"><span class="div"></span>
    <span class="tile">${q.get('icon') || '⚓'}</span>
    <div><h2>${q.get('title') || ''}</h2>${q.get('sub') ? `<p>${q.get('sub')}</p>` : ''}</div>
    ${n ? `<span class="num">${n}</span>` : ''}
    ${waves(24,2,.22)}
  </div>`;
}
</script>
</body>
</html>
